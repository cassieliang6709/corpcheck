# Local Postgres + pgvector for CorpCheck evaluation.
# Restores the financial_rag corpus from a dump on first container start.
#
# The dump is NOT committed to this repo (too large). Download it separately
# and place it next to this file as financial_rag.dump before running:
#
#     docker compose up -d db
#
# Expected post-restore corpus (must match evaluation/RESULTS.md):
#   filings    1662
#   chunks     469874
#   amendments 0

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: financial_rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./financial_rag.dump:/docker-entrypoint-initdb.d/financial_rag.dump
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U postgres -d financial_rag"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
