<style>
:root{
  --bg:#0A0C0F; --panel:#111519; --panel-2:#151A20; --line:#212A33;
  --fg:#E7ECF2; --fg-dim:#94A2B2; --fg-faint:#63707E;
  --accent:#5EEAD4; --accent-2:#7DA2FF; --warn:#FBBF24;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --maxw:1080px;
}
/* Chinese needs a slightly looser line-height and a CJK-aware stack. */
html[lang="zh-CN"]{
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",
         "Microsoft YaHei","Segoe UI",Inter,sans-serif;
}
html[lang="zh-CN"] body{line-height:1.75}
html[lang="zh-CN"] h1{letter-spacing:-.01em}
html[lang="zh-CN"] .eyebrow,
html[lang="zh-CN"] .stage-label{letter-spacing:.08em}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font-family:var(--sans); line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--accent); text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:var(--maxw); margin:0 auto; padding:0 24px}
section{padding:88px 0; border-top:1px solid var(--line)}
section:first-of-type{border-top:0}

.eyebrow{
  font-family:var(--mono); font-size:11px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--accent); margin:0 0 16px;
}
h1{font-size:clamp(34px,5.5vw,58px); line-height:1.08; letter-spacing:-.025em; margin:0 0 20px; font-weight:640}
h2{font-size:clamp(24px,3.2vw,34px); line-height:1.18; letter-spacing:-.02em; margin:0 0 14px; font-weight:640}
h3{font-size:17px; margin:0 0 8px; font-weight:620; letter-spacing:-.01em}
p{margin:0 0 16px; color:var(--fg-dim)}
.lede{font-size:clamp(16px,2vw,19px); max-width:62ch; color:var(--fg-dim)}
.section-intro{max-width:64ch; margin-bottom:40px}

/* ---------- nav ---------- */
nav{
  position:sticky; top:0; z-index:50; backdrop-filter:blur(12px);
  background:rgba(10,12,15,.82); border-bottom:1px solid var(--line);
}
nav .wrap{display:flex; align-items:center; gap:28px; height:60px}
.brand{font-weight:660; letter-spacing:-.02em; color:var(--fg); font-size:15px}
.brand span{color:var(--accent)}
.nav-links{margin-left:auto; display:flex; gap:26px; align-items:center}
.nav-links a{color:var(--fg-dim); font-size:14px}
.nav-links a:hover{color:var(--fg); text-decoration:none}
.lang{
  font-family:var(--mono); font-size:12px; color:var(--fg-dim);
  border:1px solid var(--line); border-radius:6px; padding:5px 10px;
  background:none; cursor:pointer; transition:border-color .15s,color .15s;
}
.lang:hover{color:var(--fg); border-color:#33414F}
@media(max-width:680px){ .nav-links a:not(.btn){display:none} }

/* ---------- buttons ---------- */
.btn{
  display:inline-flex; align-items:center; gap:8px; border-radius:7px;
  padding:11px 18px; font-size:14px; font-weight:560; cursor:pointer;
  border:1px solid var(--line); background:var(--panel-2); color:var(--fg);
  transition:border-color .15s, background .15s, transform .05s;
}
.btn:hover{border-color:#33414F; background:#1A2027; text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent); border-color:var(--accent); color:#04201C; font-weight:640}
.btn-primary:hover{background:#7BF0DD; border-color:#7BF0DD}
.btn-row{display:flex; gap:12px; flex-wrap:wrap; margin-top:32px}

/* ---------- hero ---------- */
.hero{padding:96px 0 76px; position:relative; overflow:hidden}
.hero::before{
  content:""; position:absolute; inset:-40% 30% 55% -10%; pointer-events:none;
  background:radial-gradient(ellipse at center, rgba(94,234,212,.09), transparent 62%);
}
.hero .wrap{position:relative}
.hero h1 em{font-style:normal; color:var(--accent)}

/* ---------- stats ---------- */
.stats{display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--line);
  border:1px solid var(--line); border-radius:10px; overflow:hidden; margin-top:56px}
.stat{background:var(--panel); padding:22px 20px}
.stat .n{font-family:var(--mono); font-size:clamp(20px,2.6vw,27px); color:var(--fg); letter-spacing:-.02em}
.stat .l{font-size:12px; color:var(--fg-faint); margin-top:5px; letter-spacing:.02em}
@media(max-width:720px){ .stats{grid-template-columns:repeat(2,1fr)} }

/* ---------- principles ---------- */
.cards{display:grid; grid-template-columns:repeat(3,1fr); gap:18px}
@media(max-width:820px){ .cards{grid-template-columns:1fr} }
.card{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:26px 24px}
.card .num{font-family:var(--mono); font-size:12px; color:var(--accent); margin-bottom:14px}
.card p{margin:0; font-size:14.5px}

/* ---------- pipeline ---------- */
.pipe{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:28px 24px; margin-bottom:22px}
.pipe-head{display:flex; align-items:baseline; gap:12px; margin-bottom:22px; flex-wrap:wrap}
.pipe-head h3{margin:0}
.tag{font-family:var(--mono); font-size:11px; color:var(--fg-faint); border:1px solid var(--line);
  border-radius:20px; padding:3px 11px}
.flow{display:flex; align-items:stretch; gap:0; flex-wrap:wrap}
.node{
  background:var(--panel-2); border:1px solid var(--line); border-radius:8px;
  padding:11px 14px; font-size:13px; min-width:0; flex:1 1 auto;
}
.node b{display:block; font-weight:580; color:var(--fg); font-size:13px; letter-spacing:-.005em}
.node small{display:block; color:var(--fg-faint); font-family:var(--mono); font-size:10.5px; margin-top:3px}
.node.hl{border-color:rgba(94,234,212,.45); background:rgba(94,234,212,.06)}
.node.hl b{color:var(--accent)}
.node.soon{border-style:dashed; border-color:rgba(251,191,36,.4); background:rgba(251,191,36,.05)}
.node.soon b{color:var(--warn)}
.arw{display:flex; align-items:center; padding:0 9px; color:var(--fg-faint); font-size:14px; flex:0 0 auto}
@media(max-width:760px){
  .flow{flex-direction:column}
  .arw{padding:5px 0; justify-content:center; transform:rotate(90deg)}
}
.split{display:grid; grid-template-columns:1fr 1fr; gap:10px; flex:1 1 auto}
@media(max-width:760px){ .split{grid-template-columns:1fr} }
.stage-label{font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--fg-faint); margin:0 0 10px}
.flow + .stage-label{margin-top:24px}
.note{font-size:13px; color:var(--fg-faint); margin:18px 0 0; padding-top:16px; border-top:1px solid var(--line)}
.note code{font-family:var(--mono); color:var(--fg-dim); font-size:12px}

/* ---------- stack table ---------- */
.stack{border:1px solid var(--line); border-radius:10px; overflow:hidden}
.srow{display:grid; grid-template-columns:170px 1fr; gap:20px; padding:15px 22px;
  border-top:1px solid var(--line); background:var(--panel); font-size:14px}
.srow:first-child{border-top:0}
.srow dt{font-family:var(--mono); font-size:12px; color:var(--fg-faint); letter-spacing:.02em}
.srow dd{margin:0; color:var(--fg-dim)}
.srow dd b{color:var(--fg); font-weight:560}
@media(max-width:640px){ .srow{grid-template-columns:1fr; gap:5px} }

/* ---------- form ---------- */
.form-panel{
  background:var(--panel); border:1px solid var(--line); border-radius:12px;
  padding:34px 32px; max-width:560px;
}
label{display:block; font-size:13px; color:var(--fg-dim); margin:0 0 7px; font-weight:520}
input,textarea,select{
  width:100%; background:#0C1015; border:1px solid var(--line); border-radius:7px;
  padding:11px 13px; color:var(--fg); font-family:inherit; font-size:14.5px; margin-bottom:18px;
}
input:focus,textarea:focus,select:focus{outline:none; border-color:var(--accent-2)}
textarea{resize:vertical; min-height:88px}
.hp{position:absolute; left:-9999px; width:1px; height:1px; opacity:0}
.form-msg{font-size:14px; margin-top:16px; display:none; padding:12px 14px; border-radius:7px}
.form-msg.ok{display:block; background:rgba(94,234,212,.1); border:1px solid rgba(94,234,212,.35); color:var(--accent)}
.form-msg.err{display:block; background:rgba(248,113,113,.1); border:1px solid rgba(248,113,113,.35); color:#F87171}
.fineprint{font-size:12.5px; color:var(--fg-faint); margin:14px 0 0}

/* ---------- footer ---------- */
footer{border-top:1px solid var(--line); padding:36px 0; font-size:13px; color:var(--fg-faint)}
footer .wrap{display:flex; gap:20px; flex-wrap:wrap; align-items:center}
footer .sp{margin-left:auto}

@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{transition-duration:.01ms !important; animation-duration:.01ms !important}
}
</style>
</head>

(function(){
  var C = window.CORPCHECK_CONFIG;
  var STORE_KEY = "corpcheck.locale";

  /* ---- locale resolution: ?lang= wins, then saved choice, then browser ---- */
  function resolveLocale(){
    var q = new URLSearchParams(location.search).get("lang");
    if (q === "en" || q === "zh") return q;
    try {
      var saved = localStorage.getItem(STORE_KEY);
      if (saved === "en" || saved === "zh") return saved;
    } catch (e) { /* private mode — fall through */ }
    return /^zh\b/i.test(navigator.language || "") ? "zh" : (C.DEFAULT_LOCALE || "en");
  }

  var locale = resolveLocale();

  function t(key){ return (COPY[locale] && COPY[locale][key]) || COPY.en[key] || ""; }

  function render(){
    var d = COPY[locale];
    document.documentElement.lang = d["html.lang"];
    document.title = d["html.title"];
    var meta = document.querySelector('meta[name="description"]');
    if (meta) meta.content = d["html.desc"];

    document.querySelectorAll("[data-i18n]").forEach(function(el){
      el.textContent = t(el.getAttribute("data-i18n"));
    });
    // Keys whose copy contains inline markup (<em>, <code>, <br>…).
    document.querySelectorAll("[data-i18n-html]").forEach(function(el){
      el.innerHTML = t(el.getAttribute("data-i18n-html"));
    });
    document.querySelectorAll("[data-i18n-ph]").forEach(function(el){
      el.placeholder = t(el.getAttribute("data-i18n-ph"));
    });
    document.getElementById("lang-toggle").textContent = d["lang.toggle"];
  }

  document.getElementById("lang-toggle").addEventListener("click", function(){
    locale = (locale === "en") ? "zh" : "en";
    try { localStorage.setItem(STORE_KEY, locale); } catch (e) {}
    // Keep the URL shareable in the language the visitor is actually reading.
    var url = new URL(location.href);
    url.searchParams.set("lang", locale);
    history.replaceState(null, "", url);
    render();
  });

  /* ---- config-driven links ---- */
  ["nav-gh","hero-gh","foot-gh"].forEach(function(id){
    var el = document.getElementById(id);
    if (el) el.href = C.GITHUB_URL;
  });
  document.getElementById("foot-mail").href = "mailto:" + C.CONTACT_EMAIL;

  if (C.APP_URL) {
    var app = document.getElementById("hero-app");
    app.href = C.APP_URL;
    app.style.display = "inline-flex";
  }

  /* ---- demo form ---- */
  var form = document.getElementById("demo-form");
  var msg  = document.getElementById("form-msg");
  var btn  = document.getElementById("submit-btn");

  function show(kind, text){ msg.className = "form-msg " + kind; msg.textContent = text; }

  form.addEventListener("submit", function(e){
    e.preventDefault();

    // Honeypot: a filled hidden field means a bot. Fake success, send nothing.
    if (form.company_website.value) { show("ok", t("msg.ok")); return; }

    var email = form.email.value.trim();
    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      show("err", t("msg.invalid"));
      return;
    }

    var payload = {
      email: email,
      name: form.name.value.trim(),
      context: form.context.value.trim(),
      locale: locale,
      source: "corpcheck-landing"
    };

    // No endpoint configured -> fall back to opening a pre-filled mail draft.
    if (!C.FORM_ENDPOINT) {
      var body = "Email: " + payload.email
               + "\nName: " + (payload.name || "-")
               + "\n\nInterested in:\n" + (payload.context || "-");
      window.location.href = "mailto:" + C.CONTACT_EMAIL
        + "?subject=" + encodeURIComponent("CorpCheck demo request")
        + "&body=" + encodeURIComponent(body);
      show("ok", t("msg.mailto"));
      return;
    }

    btn.disabled = true;
    btn.textContent = t("msg.sending");

    fetch(C.FORM_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify(payload)
    }).then(function(r){
      if (!r.ok) throw new Error("HTTP " + r.status);
      form.reset();
      show("ok", t("msg.ok"));
    }).catch(function(){
      show("err", t("msg.err") + C.CONTACT_EMAIL);
    }).finally(function(){
      btn.disabled = false;
      btn.textContent = t("dem.submit");
    });
  });

  render();
})();
</script>
