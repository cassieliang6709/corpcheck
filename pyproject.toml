[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "corpcheck"
version = "0.1.0"
description = "Audit-grade fundamental research over SEC filings"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.29.0",
    "fastapi>=0.111.0",
    "httpx>=0.27.0",
    "openai>=1.40.0",
    "pgvector>=0.3.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "sentence-transformers>=2.7.0",
    "sse-starlette>=2.1.0",
    "uvicorn[standard]>=0.29.0",
]

[project.optional-dependencies]
# Everything the offline ingestion pipeline needs. Not required to serve queries
# against an already-populated database.
ingestion = [
    "beautifulsoup4>=4.12",
    "feedparser>=6.0",
    "fredapi>=0.5",
    "lxml>=5.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "psycopg2-binary>=2.9",
    "requests>=2.31",
    "sec-edgar-downloader>=0.4",
    "tqdm>=4.66",
    "yfinance>=0.2",
]
# Model Context Protocol server. Optional because the HTTP API and the offline
# evaluation harness never import it.
mcp = [
    "mcp>=2.0.0",
]
dev = [
    "anyio>=4.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[project.scripts]
corpcheck-mcp = "corpcheck.mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"corpcheck.db" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "evaluation", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# The codebase consistently uses typing.Optional/Union rather than PEP 604 `X | None`.
# Enforcing the newer style would mean rewriting every ported module for no
# behavioural gain, so the existing convention is kept.
ignore = ["UP007", "UP035", "UP045"]

[tool.ruff.lint.per-file-ignores]
# pipeline.py deliberately configures logging before importing heavy modules,
# so its imports cannot all sit at the top of the file.
"src/corpcheck/ingestion/pipeline.py" = ["E402"]
